<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veículos | ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/dashboard.css" rel="stylesheet" />
    <style> .text-uppercase { text-transform: uppercase; } </style>
</head>
<body>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar">
            <div class="brand"><i class="fa-solid fa-car"></i><span>ERP Menu</span></div>
            <nav>
                <a class="nav-link" href="../dashboard.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>

                <hr class="text-white opacity-50 my-2">

                <small class="text-uppercase text-white-50 px-3 small fw-bold">Geografia</small>
                <a class="nav-link" href="paises.html"><i class="fa-solid fa-globe"></i><span>Países</span></a>
                <a class="nav-link" href="estados.html"><i class="fa-solid fa-map"></i><span>Estados</span></a>
                <a class="nav-link" href="cidades.html"><i class="fa-solid fa-city"></i><span>Cidades</span></a>

                <hr class="text-white opacity-50 my-2">

                <small class="text-uppercase text-white-50 px-3 small fw-bold">Operacional</small>
                <a class="nav-link" href="clientes.html"><i class="fa-solid fa-users"></i><span>Clientes</span></a>
                <a class="nav-link" href="fornecedores.html"><i class="fa-solid fa-truck-field"></i><span>Fornecedores</span></a>
                <a class="nav-link" href="transportadores.html"><i class="fa-solid fa-truck-fast"></i><span>Transportadores</span></a>
                <a class="nav-link" href="produtos.html"><i class="fa-solid fa-box"></i><span>Produtos</span></a>

                <hr class="text-white opacity-50 my-2">

                <small class="text-uppercase text-white-50 px-3 small fw-bold">Veículos</small>
                <a class="nav-link" href="marcas.html"><i class="fa-solid fa-tag"></i><span>Marcas</span></a>
                <a class="nav-link" href="modelos.html"><i class="fa-solid fa-tags"></i><span>Modelos</span></a>
                <a class="nav-link active" href="veiculos.html"><i class="fa-solid fa-car"></i><span>Veículos</span></a>

                <hr class="text-white opacity-50 my-2">

                <small class="text-uppercase text-white-50 px-3 small fw-bold">Administrativo</small>
                <a class="nav-link" href="condicoes_pagamento.html"><i class="fa-solid fa-credit-card"></i><span>Condições Pgto.</span></a>
                <a class="nav-link" href="funcionarios.html"><i class="fa-solid fa-id-badge"></i><span>Funcionários</span></a>
            </nav>
        </aside>
        <div class="main-wrapper">
            <header class="topbar"><button id="toggleSidebar" class="btn btn-light btn-sm"><i class="fa-solid fa-bars"></i></button><div><h1>Veículos</h1></div></header>
            <main class="content">
                <div class="card erp-card">
                    <div class="card-header d-flex justify-content-between"><span>Listagem</span><button id="btnNovo" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#crudModal"><i class="fa-solid fa-plus"></i> Novo</button></div>
                    <div class="card-body">
                        <table id="mainTable" class="table table-striped w-100">
                            <thead><tr><th>Placa</th><th>Modelo</th><th>Cor</th><th>Combustível</th><th>Km</th><th>Ações</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- ========================================================= -->
                <!-- MODAL 1: VEÍCULO PRINCIPAL -->
                <!-- ========================================================= -->
                <div class="modal fade" id="crudModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <form id="crudForm">
                                <div class="modal-header"><h5 class="modal-title">Cadastro de Veículo</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                <div class="modal-body">
                                    <input type="hidden" id="recordId" name="id" />
                                    <div class="row g-3">
                                        <div class="col-md-11">
                                            <label class="form-label">Modelo *</label>
                                            <select id="idModelo" name="modelo_id" class="form-select" required></select>
                                        </div>
                                        <div class="col-md-1 d-flex align-items-end">
                                            <!-- Vai para o Modal de Modelo -->
                                            <button type="button" class="btn btn-secondary w-100" id="btnNovoModelo" data-bs-toggle="modal" data-bs-target="#modalNovoModelo"><i class="fa-solid fa-plus"></i></button>
                                        </div>
                                        
                                        <div class="col-md-4"><label class="form-label">Placa *</label><input type="text" name="placa" class="form-control text-uppercase" required></div>
                                        <div class="col-md-4"><label class="form-label">Renavam</label><input type="text" name="renavam" class="form-control text-uppercase"></div>
                                        <div class="col-md-4"><label class="form-label">Chassi</label><input type="text" name="chassi" class="form-control text-uppercase"></div>
                                        
                                        <div class="col-md-3"><label class="form-label">Cor</label><input type="text" name="cor" class="form-control text-uppercase"></div>
                                        <div class="col-md-3"><label class="form-label">Ano Fab.</label><input type="number" name="ano_fabricacao" class="form-control text-uppercase"></div>
                                        <div class="col-md-3"><label class="form-label">Ano Modelo</label><input type="number" name="ano_modelo" class="form-control text-uppercase"></div>
                                        <div class="col-md-3"><label class="form-label">Km</label><input type="number" name="quilometragem" class="form-control text-uppercase"></div>
                                        
                                        <div class="col-md-12">
                                            <label class="form-label">Combustível *</label>
                                            <select name="combustivel" class="form-select text-uppercase" required>
                                                <option value="">Selecione o tipo...</option>
                                                <option value="GASOLINA">GASOLINA</option>
                                                <option value="ALCOOL">ÁLCOOL</option>
                                                <option value="FLEX">FLEX (GASOLINA/ÁLCOOL)</option>
                                                <option value="DIESEL">DIESEL</option>
                                                <option value="ELETRICO">ELÉTRICO</option>
                                                <option value="HIBRIDO">HÍBRIDO</option>
                                            </select>
                                        </div>                                    
                                    </div>
                                </div>
                                <div class="modal-footer"><button type="submit" class="btn btn-primary">Salvar Veículo</button></div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- ========================================================= -->
                <!-- MODAL 2: CADASTRO DE MODELO -->
                <!-- ========================================================= -->
                <div class="modal fade" id="modalNovoModelo" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <form id="formNovoModelo">
                                <div class="modal-header">
                                    <h5 class="modal-title">Cadastrar Novo Modelo</h5>
                                    <!-- Botão Fechar volta pro Modal de Veículo -->
                                    <button type="button" class="btn-close" data-bs-toggle="modal" data-bs-target="#crudModal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row g-3">
                                        <div class="col-md-8">
                                            <label class="form-label">Modelo *</label>
                                            <input type="text" name="modelo" class="form-control" style="text-transform: uppercase;" required>
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label">Marca *</label>
                                            <select id="idMarcaNovoModelo" name="id_marca" class="form-select" required></select>
                                        </div>
                                        <div class="col-md-1 d-flex align-items-end">
                                            <!-- Vai para o Modal de Marca -->
                                            <button type="button" class="btn btn-secondary w-100" id="btnNovaMarcaFromVeiculo" title="Cadastrar Nova Marca" data-bs-toggle="modal" data-bs-target="#marcaModal"><i class="fa-solid fa-plus"></i></button>
                                        </div>
                                        
                                        <div class="col-md-4">
                                            <label class="form-label">Tipo de Veículo *</label>
                                            <select name="tipo" class="form-select" required>
                                                <option value="">Selecione...</option>
                                                <option value="CARRO">Carro</option>
                                                <option value="MOTO">Moto</option>
                                                <option value="CAMINHAO">Caminhão</option>
                                                <option value="ONIBUS">Ônibus</option>
                                                <option value="OUTROS">Outros</option>
                                            </select>
                                        </div>
                                        
                                        <div class="col-md-8">
                                            <label class="form-label">Descrição</label>
                                            <input type="text" name="descricao" class="form-control" style="text-transform: uppercase;">
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer"><button type="submit" class="btn btn-primary">Salvar Modelo</button></div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- ========================================================= -->
                <!-- MODAL 3: CADASTRO DE MARCA -->
                <!-- ========================================================= -->
                <div class="modal fade" id="marcaModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form id="marcaForm">
                                <div class="modal-header">
                                    <h5 class="modal-title">Nova Marca</h5>
                                    <!-- Botão Fechar volta pro Modal de Modelo -->
                                    <button type="button" class="btn-close" data-bs-toggle="modal" data-bs-target="#modalNovoModelo"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row g-3">
                                        <div class="col-md-12"><label class="form-label">Nome da Marca *</label><input type="text" name="nome" class="form-control text-uppercase" required></div>
                                    </div>
                                </div>
                                <div class="modal-footer"><button type="submit" class="btn btn-success">Salvar Marca</button></div>
                            </form>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/veiculos.js"></script>
</body>
</html>
