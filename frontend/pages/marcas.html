<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marcas | ERP Front-End</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/dashboard.css" rel="stylesheet" />
    <style>
        /* GARANTE QUE QUALQUER TEXTO INSERIDO SEMPRE SEJA EXIBIDO EM MAIÚSCULO */
        body { text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-layer-group"></i><span>Cidade-Estado-Pais</span>
            </div>
            <nav>
                <!-- Dashboard e Cadastros Base -->
                <a class="nav-link" href="../dashboard.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>

                <hr class="text-white opacity-50 my-2">

                <!-- Geografia -->
                <small class="text-uppercase text-white-50 px-3 small fw-bold">Geografia</small>
                <a class="nav-link" href="paises.html"><i class="fa-solid fa-globe"></i><span>Países</span></a>
                <a class="nav-link" href="estados.html"><i class="fa-solid fa-map"></i><span>Estados</span></a>
                <a class="nav-link" href="cidades.html"><i class="fa-solid fa-city"></i><span>Cidades</span></a>

                <hr class="text-white opacity-50 my-2">

                <!-- Operacional -->
                <small class="text-uppercase text-white-50 px-3 small fw-bold">Operacional</small>
                <a class="nav-link" href="clientes.html"><i class="fa-solid fa-users"></i><span>Clientes</span></a>
                <a class="nav-link" href="fornecedores.html"><i class="fa-solid fa-truck-field"></i><span>Fornecedores</span></a>
                <a class="nav-link" href="transportadores.html"><i class="fa-solid fa-truck-fast"></i><span>Transportadores</span></a>
                <a class="nav-link" href="produtos.html"><i class="fa-solid fa-box"></i><span>Produtos</span></a>
                <a class="nav-link active" href="marcas.html"><i class="fa-solid fa-tag"></i><span>Marcas</span></a>
                <a class="nav-link" href="categorias.html"><i class="fa-solid fa-tag"></i><span>Categorias</span></a>

                <hr class="text-white opacity-50 my-2">

                <!-- Veículos -->
                <small class="text-uppercase text-white-50 px-3 small fw-bold">Veículos</small>
                <a class="nav-link" href="modelos.html"><i class="fa-solid fa-tags"></i><span>Modelos</span></a>
                <a class="nav-link" href="veiculos.html"><i class="fa-solid fa-car"></i><span>Veículos</span></a>

                <hr class="text-white opacity-50 my-2">

                <!-- Administrativo -->
                <small class="text-uppercase text-white-50 px-3 small fw-bold">Administrativo</small>
                <a class="nav-link" href="condicoes_pagamento.html"><i class="fa-solid fa-credit-card"></i><span>Condições de Pagto</span></a>
                <a class="nav-link" href="formas_pagamento.html"><i class="fa-solid fa-credit-card"></i><span>Condições de Pagto</span></a>
                <a class="nav-link" href="funcionarios.html"><i class="fa-solid fa-id-badge"></i><span>Funcionários</span></a>            
                <a class="nav-link" href="relatorio_compras.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Compras e Contas</span></a>
            </nav>
        </aside>              
        <div class="main-wrapper" style="width: 100%;">
            <header class="topbar">
                <button id="toggleSidebar" class="btn btn-light btn-sm"><i class="fa-solid fa-bars"></i></button>
                <div><h1>MARCAS</h1></div>
            </header>
            <main class="content">
                <div class="card erp-card">
                    <div class="card-header d-flex justify-content-between">
                        <span>LISTAGEM DE MARCAS</span>
                        <button id="btnNovo" class="btn btn-primary"><i class="fa-solid fa-plus"></i> NOVO</button>
                    </div>
                    <div class="card-body">
                        <table id="mainTable" class="table table-striped w-100">
                            <thead>
                                <tr>
                                    <th>MARCA</th>
                                    <th>AÇÕES</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- MODAL DE CADASTRO DE MARCA -->
                <div class="modal fade" id="crudModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form id="crudForm">
                                <div class="modal-header">
                                    <h5 class="modal-title">CADASTRO</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="hidden" id="recordId" name="id" />
                                    <div class="row g-3">
                                        <div class="col-md-12">
                                            <label class="form-label">MARCA *</label>
                                            <input type="text" name="marca" class="form-control" style="text-transform: uppercase;" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="submit" class="btn btn-primary">SALVAR</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/marcas.js"></script>
</body>
</html>
