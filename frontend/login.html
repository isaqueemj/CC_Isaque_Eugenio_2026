<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autenticação | Sistema ERP Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="css/login.css" rel="stylesheet" />
</head>
<body>
    <!-- Container de Toasts (Alertas Flutuantes) -->
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <main class="auth-wrapper">
        <div class="auth-card">
            <!-- Cabeçalho da Marca -->
            <div class="auth-brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <h1>ERP Financeiro</h1>
                <p>Gestão integrada e inteligente para o seu negócio</p>
            </div>

            <!-- Abas de Alternância (Entrar / Criar Conta) -->
            <div class="auth-tabs" role="tablist">
                <button type="button" id="tabLogin" class="auth-tab active" onclick="alternarAba('login')">
                    Entrar
                </button>
                <button type="button" id="tabRegister" class="auth-tab" onclick="alternarAba('register')">
                    Criar Conta
                </button>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="formLogin" class="auth-form" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">E-mail</label>
                    <div class="input-group-custom">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" class="form-control" placeholder="seu@email.com" autocomplete="email" required />
                    </div>
                    <small class="error-msg" id="erroLoginEmail"></small>
                </div>

                <div class="mb-4">
                    <label for="loginSenha" class="form-label">Senha</label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="loginSenha" class="form-control" placeholder="Digite sua senha" autocomplete="current-password" required />
                        <button type="button" class="btn-toggle-pass" onclick="alternarVisibilidadeSenha('loginSenha', this)" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <small class="error-msg" id="erroLoginSenha"></small>
                </div>

                <button type="submit" id="btnSubmitLogin" class="btn btn-primary w-100 btn-auth">
                    <span>Acessar Sistema</span>
                    <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>
            </form>

            <!-- FORMULÁRIO DE CADASTRO -->
            <form id="formRegister" class="auth-form d-none" novalidate>
                <div class="mb-3">
                    <label for="regNome" class="form-label">Nome Completo *</label>
                    <div class="input-group-custom">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="regNome" class="form-control" placeholder="Ex: João da Silva" required />
                    </div>
                    <small class="error-msg" id="erroRegNome"></small>
                </div>

                <div class="mb-3">
                    <label for="regEmail" class="form-label">E-mail *</label>
                    <div class="input-group-custom">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="regEmail" class="form-control" placeholder="nome@dominio.com" required />
                    </div>
                    <small class="error-msg" id="erroRegEmail"></small>
                </div>

                <div class="mb-3">
                    <label for="regCpf" class="form-label">CPF *</label>
                    <div class="input-group-custom">
                        <i class="fa-regular fa-id-card input-icon"></i>
                        <input type="text" id="regCpf" class="form-control" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required />
                    </div>
                    <small class="error-msg" id="erroRegCpf"></small>
                </div>

                <div class="mb-4">
                    <label for="regSenha" class="form-label">Senha *</label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="regSenha" class="form-control" placeholder="Mínimo de 6 caracteres" required />
                        <button type="button" class="btn-toggle-pass" onclick="alternarVisibilidadeSenha('regSenha', this)" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <small class="error-msg" id="erroRegSenha"></small>
                </div>

                <button type="submit" id="btnSubmitRegister" class="btn btn-primary w-100 btn-auth">
                    <span>Criar Minha Conta</span>
                    <i class="fa-solid fa-user-plus ms-2"></i>
                </button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
